<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100" height="100">
  <!-- Components are drawn inside the existing silhouette. Each named group
       is one overhead casting in the coordinate system of its visible bounds. -->
  <defs>
    <linearGradient id="paint" x2=".35" y2="1"><stop stop-color="#fc683e"/><stop offset="1" stop-color="#df4f2d"/></linearGradient>
    <linearGradient id="iron" x2=".25" y2="1"><stop stop-color="#514e4c"/><stop offset="1" stop-color="#343538"/></linearGradient>
    <linearGradient id="roof" x2=".45" y2="1"><stop stop-color="#b9b6b5"/><stop offset="1" stop-color="#a4a2a3"/></linearGradient>
    <symbol id="lug" viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect x="1" y="7" width="98" height="92" rx="4" fill="#4a302b"/>
      <rect width="100" height="90" rx="4" fill="#ab412a"/>
      <rect x="1" y="1" width="98" height="80" rx="3" fill="url(#paint)"/>
      <path d="M4 2h92v4H4Z" fill="#ff7950"/>
    </symbol>
    <symbol id="well" viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect width="100" height="100" rx="5" fill="#ff8058"/>
      <rect width="100" height="94" rx="4" fill="#26272a"/>
      <rect x="4" y="10" width="92" height="83" rx="3" fill="url(#iron)"/>
    </symbol>
    <g id="Ball">
      <rect width="100" height="100" fill="url(#iron)"/>
      <circle cx="50" cy="50" r="45.7" fill="url(#paint)"/>
    </g>
    <g id="BigBall">
      <rect width="100" height="100" fill="url(#iron)"/>
      <circle cx="50" cy="50" r="46" fill="url(#paint)"/>
      <!-- Three collar joints stop at the shoulder of the broad central dome. -->
      <g fill="none" stroke="#833c2d" stroke-width="2">
        <circle cx="50" cy="50" r="34"/>
        <path d="M50 4v12m29.4 51 10.4 6M20.6 67l-10.4 6"/>
      </g>
      <circle cx="50" cy="50" r="32.5" fill="url(#paint)"/>
    </g>
    <g id="ShootBall">
      <rect width="100" height="100" fill="url(#iron)"/>
      <path fill="url(#paint)" fill-rule="evenodd"
        d="M50 5a45 45 0 1 1 0 90 45 45 0 1 1 0-90Z M50 33a17 17 0 1 0 0 34 17 17 0 1 0 0-34Z"/>
      <circle cx="50" cy="50" r="14" fill="#303033"/>
      <circle cx="50" cy="50" r="10" fill="#232427"/>
    </g>
    <g id="Airship">
      <rect width="100" height="100" fill="url(#iron)"/>
      <rect x="2" y="40" width="96" height="8" fill="url(#paint)"/>
      <ellipse cx="50" cy="50" rx="36.5" ry="50" fill="url(#iron)"/>
      <ellipse cx="50" cy="50" rx="33.2" ry="47.2" fill="url(#paint)"/>
      <path d="M20.2 68q29.8 11 59.6 0l-1.7 3.5q-28 10-56.2 0Z" fill="#793c30"/>
      <use xlink:href="#well" x="34" y="22" width="6" height="38"/>
      <use xlink:href="#well" x="47" y="21" width="6" height="40"/>
      <use xlink:href="#well" x="60" y="22" width="6" height="38"/>
      <use xlink:href="#well" x="39" y="76" width="22" height="11"/>
      <use xlink:href="#lug" x="1.9" y="40" width="7" height="24"/><use xlink:href="#lug" x="91.1" y="40" width="7" height="24"/>
    </g>
    <g id="MissileStorm">
      <rect width="100" height="100" fill="url(#iron)"/>
      <rect x="4" y="4" width="92" height="92" fill="url(#paint)"/>
      <use xlink:href="#well" x="12" y="11" width="27" height="26"/>
      <use xlink:href="#well" x="61" y="11" width="27" height="26"/>
      <use xlink:href="#well" x="12" y="64" width="27" height="26"/>
      <use xlink:href="#well" x="61" y="64" width="27" height="26"/>
      <use xlink:href="#lug" x="39" y="42" width="23" height="18"/>
      <use xlink:href="#lug" x="5" y="5" width="12" height="11"/><use xlink:href="#lug" x="83" y="5" width="12" height="11"/>
      <use xlink:href="#lug" x="5" y="84" width="12" height="11"/><use xlink:href="#lug" x="83" y="84" width="12" height="11"/>
    </g>
    <g id="MissilePod">
      <rect width="100" height="100" fill="url(#iron)"/><rect x="5" y="7" width="90" height="86" fill="url(#paint)"/>
      <use xlink:href="#well" x="10" y="18" width="24" height="65"/><use xlink:href="#well" x="66" y="18" width="24" height="65"/>
      <rect x="37" y="30" width="26" height="39" rx="1" fill="#26272a"/>
      <use xlink:href="#lug" x="40" y="34" width="20" height="31"/>
    </g>
    <g id="MissileTriple">
      <rect width="100" height="100" fill="url(#iron)"/><rect x="4" y="6" width="92" height="88" fill="url(#paint)"/>
      <use xlink:href="#well" x="10" y="13" width="21" height="36"/><use xlink:href="#well" x="40" y="49" width="21" height="36"/>
      <use xlink:href="#well" x="70" y="13" width="21" height="36"/>
    </g>
    <!-- Building drawings encode height. Draw each support in full, then its cap.
         The baker lights these levels from overhead, including the wreck variants. -->
    <g id="base"><rect width="100" height="100" fill="#666"/><rect x="2" y="2" width="96" height="96" fill="#b1b1b1"/></g>
    <g id="Building2">
      <use xlink:href="#base"/>
      <rect x="2" y="1" width="23" height="97" rx="1" fill="#e5e5e5"/>
      <path d="M26 41h72" stroke="#666" stroke-width="2"/>
      <g fill="#e5e5e5"><rect x="35" y="9" width="57" height="25" rx="1"/>
        <rect x="35" y="48" width="57" height="42" rx="1"/></g>
    </g>
    <g id="Building4">
      <use xlink:href="#base"/>
      <path d="M2 64h96" stroke="#666" stroke-width="2"/>
      <g fill="#e5e5e5">
        <rect x="12" y="12" width="24" height="41" rx="1"/><rect x="66" y="12" width="24" height="41" rx="1"/>
        <rect x="15" y="73" width="18" height="18" rx="1"/><rect x="42" y="73" width="18" height="18" rx="1"/>
        <rect x="68" y="73" width="18" height="18" rx="1"/>
      </g>
      <rect x="26" y="23" width="50" height="18" rx="1" fill="#fff"/>
    </g>
    <g id="SmallBuilding1">
      <rect width="100" height="100" fill="#666"/>
      <path fill="#b1b1b1" fill-rule="evenodd" d="M2 2h96v96H2Z M8 9v82h84V9Z"/>
      <g fill="#e5e5e5"><rect x="29" y="27" width="42" height="43" rx="1"/>
        <rect x="40" width="20" height="15"/><rect x="40" y="85" width="20" height="15"/>
        <rect y="39" width="14" height="21"/><rect x="86" y="39" width="14" height="21"/></g>
    </g>
  </defs>
</svg>
